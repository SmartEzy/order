<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order System</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa; margin: 0; padding: 30px 20px; color: #333;
      max-width: 950px; margin-left: auto; margin-right: auto;
    }
    .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 25px; }

    /* --- 輸入區樣式 --- */
    .item-row {
      display: grid;
      grid-template-columns: 140px 90px 1fr 95px 85px 60px 35px 60px;
      gap: 8px; margin-bottom: 12px; align-items: center;
    }
    @media (max-width: 768px) {
      .item-row {
        grid-template-columns: 1fr 1fr 60px;
        background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 15px;
      }
      .drop-zone { grid-row: span 2; grid-column: 3; } 
    }
    
    input, select {
      padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box;
      color: #333; background: #fff;
    }
    input:focus, select:focus { border-color: #5f6368; outline: none; }
    
    .drop-zone {
      width: 60px; height: 60px; border: 1px dashed #bbb; border-radius: 4px;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      background-color: #f8f9fa; background-size: cover; background-position: center;
      position: relative; overflow: hidden; transition: 0.2s;
    }
    .drop-zone.dragover { border-color: #5f6368; background-color: #e8eaed; }
    .drop-text { font-size: 11px; color: #777; text-align: center; pointer-events: none; }
    .drop-zone.has-image .drop-text { display: none; } 
    .drop-loading {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.85); display: none;
      justify-content: center; align-items: center; font-size: 10px; color: #5f6368;
    }

    .btn { background-color: #5f6368; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; letter-spacing: 0.5px; transition: 0.2s; min-width: 110px; text-align: center; }
    .btn:hover { background-color: #3c4043; }
    
    .btn-icon { background: none; border: none; cursor: pointer; padding: 5px; fill: #9aa0a6; transition: fill 0.2s; }
    .btn-icon:hover { fill: #d93025; }

    .btn-save.saving { background-color: #9aa0a6; cursor: not-allowed; }
    .btn-save.saved { background-color: #1e8e3e; }

    .actions-top { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
    .actions-bottom { display: flex; justify-content: flex-end; margin-bottom: 10px; }

    /* 歷史紀錄表格 */
    .history-table-wrapper { overflow-x: auto; }
    table.history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.history-table th, table.history-table td { padding: 12px 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
    table.history-table th { background: #fff; color: #70757a; font-weight: 500; border-bottom: 2px solid #ddd; }
    
    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column;
      font-size: 16px; font-weight: 500; color: #5f6368;
    }
    
    #previewModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
    }
    .modal-content-wrapper {
      position: relative; max-width: 90%; max-height: 85vh; background: #fff; padding: 20px;
      border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); overflow: auto; text-align: center;
    }
    .close-btn, .share-btn { position: absolute; top: 10px; background: none; border: none; cursor: pointer; }
    .close-btn { right: 15px; font-size: 24px; color: #555; }
    .share-btn { left: 15px; padding: 4px; }
    .share-btn svg { width: 22px; height: 22px; fill: #5f6368; }
    
    #canvasResultImg { max-width: 100%; height: auto; border: 1px solid #eee; cursor: zoom-in; transition: transform 0.3s ease; }
    #canvasResultImg.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain;
      background: rgba(0,0,0,0.95); cursor: zoom-out; z-index: 2000; padding: 20px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  
  <div id="loadingOverlay">
    <div id="loadingText">Processing...</div>
  </div>

  <div class="panel">
    <div id="itemsContainer"></div>
    <div class="actions-top">
      <button class="btn" onclick="addItemRow()">ADD</button>
      <button class="btn btn-save" id="btnSave" onclick="saveToSheets()">SAVE</button>
    </div>
  </div>

  <div class="panel">
    <div class="actions-bottom">
      <button class="btn" onclick="generateSelectedPreview()">REPORT</button>
    </div>
    <div class="history-table-wrapper">
      <table class="history-table">
        <thead>
          <tr>
            <th style="width: 30px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
            <th>Date</th><th>Name</th><th>Item</th><th>Price</th><th>Disc</th><th>Total</th><th>Image</th>
            <th style="width: 40px; text-align: center;"></th>
          </tr>
        </thead>
        <tbody id="historyTbody">
          <tr><td colspan="9" style="text-align:center; color: #999;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 報表渲染區 -->
  <div id="renderArea" style="position: absolute; left: -9999px; width: 650px; background: #ffffff; padding: 40px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #2c3e50; padding-bottom: 15px; margin-bottom: 25px;">
      <h2 style="margin: 0; font-size: 26px; color: #2c3e50; text-transform: uppercase; letter-spacing: 1px;">Order Summary</h2>
      <div style="text-align: right; font-size: 14px; color: #555; line-height: 1.6;">
        <div style="font-weight: bold; color: #333;" id="reportName">Name</div>
        <div id="reportDate"></div>
      </div>
    </div>
    
    <!-- 啟用原生四欄結構，達成完美的絕對對齊 -->
    <table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">
      <thead>
        <tr style="color: #7f8c8d; font-size: 12px; text-transform: uppercase;">
          <th style="padding: 10px 4px; border-bottom: 1px solid #e0e0e0;">Item</th>
          <!-- PRICE 標題：置中，緊湊寬度 80px -->
          <th style="padding: 10px 4px; text-align: center; width: 80px; border-bottom: 1px solid #e0e0e0;">Price</th>
          <!-- DISCOUNT 標題：加入 padding-left 讓標題跟著往右推，視覺置中 -->
          <th colspan="2" style="padding: 10px 4px 10px 16px; text-align: center; width: 125px; border-bottom: 1px solid #e0e0e0;">Discount</th>
        </tr>
      </thead>
      <tbody id="reportTbody"></tbody>
      
      <tfoot>
        <tr><td colspan="4" style="height: 15px;"></td></tr>
        <tr>
          <td></td> 
          
          <!-- TOTAL 完美置中於 PRICE 欄位下方 -->
          <td style="border-top: 2px solid #2c3e50; padding: 15px 4px; text-align: center; vertical-align: top;">
            <div style="font-weight: bold; font-size: 18px; color: #2c3e50;">TOTAL</div>
          </td>
          
          <!-- 總金額對齊上方 Discount 區塊，黑線連貫 -->
          <td colspan="2" style="border-top: 2px solid #2c3e50; padding: 15px 4px 15px 0; text-align: right; vertical-align: top;">
            <div style="font-weight: bold; font-size: 20px; color: #2c3e50;" id="reportTotal">$0</div>
            <div style="color: #95a5a6; font-size: 12px; margin-top: 4px; white-space: nowrap;">(Saved <span id="reportSaved">$0</span>)</div>
          </td>
        </tr>
      </tfoot>
    </table>
    
    <div id="reportImages" style="margin-top: 40px; text-align: center; display: flex; flex-direction: column; gap: 20px; align-items: center;"></div>
  </div>

  <div id="previewModal">
    <div class="modal-content-wrapper">
      <button class="share-btn" onclick="shareOrDownloadImage()"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></button>
      <button class="close-btn" onclick="closePreview()">×</button>
      <div style="display: inline-block; margin-top: 10px;"><img id="canvasResultImg" alt="Preview"></div>
    </div>
  </div>

  <script>
    // 🔴 替換成您的 GAS Web App 網址 🔴
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwD3D6dtItQ3uawXAHWr6HFXFKaZPjheN8O2-b3H9VugD30khFiNJQ3GqawONZ5tKD1/exec";

    let generatedCanvasDataUrl = "";
    let allOrdersData = [];

    function formatNumber(num) {
        if (num === null || num === undefined) return '0';
        return Number(num).toLocaleString('en-US');
    }

    const trashIcon = `<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

    window.onload = function() {
      addItemRow();
      fetchOrders();
    };

    function showLoading(show, text = 'Processing...') { 
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = text;
        overlay.style.display = show ? 'flex' : 'none'; 
    }

    function addItemRow() {
      const container = document.getElementById('itemsContainer');
      const rows = container.getElementsByClassName('item-row');
      
      let lastDate = new Date().toISOString().split('T')[0];
      let lastName = '';
      if (rows.length > 0) {
        lastDate = rows[rows.length - 1].querySelector('.item-date').value;
        lastName = rows[rows.length - 1].querySelector('.item-name').value;
      }

      const row = document.createElement('div');
      row.className = 'item-row';
      row.dataset.imageId = "";
      row.dataset.imageUrl = "";
      
      row.innerHTML = `
        <input type="date" class="item-date" value="${lastDate}" onclick="this.select()">
        <input type="text" class="item-name" placeholder="Name" value="${lastName}" onclick="this.select()">
        <input type="text" class="item-item" placeholder="Item" onclick="this.select()">
        <input type="number" class="item-price" placeholder="Price" onclick="this.select()">
        <select class="item-discount">
          <option value="75%">75%</option>
          <option value="85%" selected>85%</option>
          <option value="90%">90%</option>
          <option value="無">無</option>
          <option value="自訂">自訂</option>
        </select>
        <input type="number" class="item-qty" placeholder="Qty" value="1" inputmode="numeric" onclick="this.select()">
        <button class="btn-icon" onclick="removeRow(this)" title="Remove item">${trashIcon}</button>
        <div class="drop-zone" onclick="this.querySelector('input').click()" ondragover="event.preventDefault(); this.classList.add('dragover');" ondragleave="this.classList.remove('dragover');" ondrop="handleDrop(event, this)">
          <span class="drop-text">+ Img</span>
          <div class="drop-loading">Up...</div>
          <input type="file" accept="image/*" style="display:none;" onchange="handleRowImageUpload(this, this.parentElement)">
        </div>
      `;
      container.appendChild(row);
    }

    function removeRow(btn) {
      if (document.getElementsByClassName('item-row').length > 1) {
        btn.parentElement.remove();
      } else { alert('至少需保留一項 (Keep at least one item)'); }
    }

    function handleDrop(event, dropZone) {
      event.preventDefault();
      dropZone.classList.remove('dragover');
      if (event.dataTransfer.files && event.dataTransfer.files[0]) {
        uploadFileForDropZone(event.dataTransfer.files[0], dropZone);
      }
    }

    function handleRowImageUpload(input, dropZone) {
      if (input.files && input.files[0]) {
        uploadFileForDropZone(input.files[0], dropZone);
      }
    }

    function uploadFileForDropZone(file, dropZone) {
      const row = dropZone.closest('.item-row');
      const reader = new FileReader();
      const loading = dropZone.querySelector('.drop-loading');
      
      loading.style.display = 'flex'; 
      
      reader.onload = function(e) {
        dropZone.style.backgroundImage = `url(${e.target.result})`;
        dropZone.classList.add('has-image');

        fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'uploadImage', base64: e.target.result, mimeType: file.type, fileName: file.name })
        }).then(res => res.json()).then(res => {
          loading.style.display = 'none';
          if (res.success) {
            row.dataset.imageId = res.fileId;
            row.dataset.imageUrl = res.url;
          } else {
            alert('Upload failed: ' + res.error);
            dropZone.style.backgroundImage = 'none';
            dropZone.classList.remove('has-image');
          }
        }).catch(err => {
          loading.style.display = 'none';
          alert('Network error: ' + err.message);
        });
      };
      reader.readAsDataURL(file);
    }

    function saveToSheets() {
      const btnSave = document.getElementById('btnSave');
      if (btnSave.classList.contains('saving')) return;

      const rows = document.querySelectorAll('.item-row');
      const dataList = [];
      let isValid = true;

      rows.forEach(row => {
        const date = row.querySelector('.item-date').value;
        const name = row.querySelector('.item-name').value;
        let itemName = row.querySelector('.item-item').value;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const discount = row.querySelector('.item-discount').value;
        const qty = parseInt(row.querySelector('.item-qty').value) || 1;
        
        const rowImageId = row.dataset.imageId || "";
        const rowImageUrl = row.dataset.imageUrl || "";

        if (!itemName || price === 0) isValid = false;

        let discountRate = 1.0;
        if (discount === '75%') discountRate = 0.75;
        else if (discount === '85%') discountRate = 0.85;
        else if (discount === '90%') discountRate = 0.90;

        const unitDiscountPrice = Math.round(price * discountRate);
        if(qty > 1) itemName = `${itemName} (x${qty})`;

        dataList.push({
          date: date, name: name, itemName: itemName, price: price, discount: discount,
          discountPrice: unitDiscountPrice, savedAmount: (price - unitDiscountPrice) * qty,
          total: unitDiscountPrice * qty, 
          imageId: rowImageId, imageUrl: rowImageUrl 
        });
      });

      if (!isValid) { alert('請填寫完整的品名與價格 (Missing Item or Price)'); return; }

      btnSave.classList.add('saving');
      btnSave.innerText = 'Saving...';

      fetch(GAS_WEB_APP_URL, {
        method: 'POST', body: JSON.stringify({ action: 'saveOrders', orders: dataList })
      }).then(res => res.json()).then(res => {
        if (res.success) {
          btnSave.classList.remove('saving');
          btnSave.classList.add('saved');
          btnSave.innerText = 'Saved! ✔';
          
          document.getElementById('itemsContainer').innerHTML = '';
          addItemRow();
          fetchOrders();

          setTimeout(() => {
            btnSave.classList.remove('saved');
            btnSave.innerText = 'SAVE';
          }, 2000);
        } else { 
          alert('Save Failed: ' + res.error); 
          btnSave.classList.remove('saving');
          btnSave.innerText = 'SAVE';
        }
      }).catch(err => {
          alert('Save Error: ' + err.message);
          btnSave.classList.remove('saving');
          btnSave.innerText = 'SAVE';
      });
    }

    function fetchOrders() {
      fetch(GAS_WEB_APP_URL + "?action=getOrders").then(res => res.json()).then(res => {
        if (res.success) { allOrdersData = res.data; renderHistoryTable(); }
      }).catch(err => { document.getElementById('historyTbody').innerHTML = `<tr><td colspan="9">Failed to load</td></tr>`; });
    }

    function deleteOrder(sheetRowIndex) {
        if(!confirm('確定要刪除這筆紀錄與附帶的圖片嗎？(Are you sure?)')) return;
        
        showLoading(true, 'Deleting...');
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'deleteOrder', rowIndex: sheetRowIndex })
        }).then(res => res.json()).then(res => {
            if (res.success) {
                fetchOrders();
                showLoading(false);
            } else {
                showLoading(false);
                alert('Delete Failed: ' + res.error);
            }
        }).catch(err => {
            showLoading(false);
            alert('Delete Error: ' + err.message);
        });
    }

    function findImageUrl(item) {
        for (const key in item) {
            if (typeof item[key] === 'string' && item[key].startsWith('http')) return item[key];
        }
        return null;
    }

    function formatDiscountForDisplay(discountVal) {
        if (!discountVal || discountVal === '無' || discountVal === '-') return '-';
        if (String(discountVal).includes('%')) return discountVal;
        let num = parseFloat(discountVal);
        if (!isNaN(num) && num < 1 && num > 0) {
            return Math.round(num * 100) + '%';
        }
        return discountVal;
    }

    function renderHistoryTable() {
      const tbody = document.getElementById('historyTbody');
      tbody.innerHTML = '';
      if(allOrdersData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color: #999;">No records found</td></tr>`; return;
      }
      allOrdersData.forEach((item, index) => {
        const tr = document.createElement('tr');
        const imageUrl = findImageUrl(item);
        const imgHtml = imageUrl ? `<a href="${imageUrl}" target="_blank" style="color: #5f6368;">Img</a>` : '-';
        const displayDate = item.Date ? item.Date.toString().split('T')[0] : '';
        const displayDiscount = formatDiscountForDisplay(item.Discount);
        
        const priceStr = formatNumber(item.Price);
        const totalStr = formatNumber(item.Total);

        tr.innerHTML = `
          <td><input type="checkbox" class="row-check" value="${index}"></td>
          <td>${displayDate}</td><td>${item.Name || ''}</td><td>${item.Item || ''}</td>
          <td>$${priceStr}</td><td>${displayDiscount}</td><td style="font-weight: 500;">$${totalStr}</td><td>${imgHtml}</td>
          <td style="text-align: center;"><button class="btn-icon" onclick="deleteOrder(${item.sheetRowIndex})" title="Delete">${trashIcon}</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleSelectAll(source) {
      checkboxes = document.querySelectorAll('.row-check');
      for (var i = 0, n = checkboxes.length; i < n; i++) checkboxes[i].checked = source.checked;
    }

    function generateSelectedPreview() {
      const selectedChecks = document.querySelectorAll('.row-check:checked');
      if(selectedChecks.length === 0) { alert('請先勾選項目 (Select items first)'); return; }

      let firstCheckedName = null;
      let hasDifferentNames = false;
      
      for (let i = 0; i < selectedChecks.length; i++) {
        const item = allOrdersData[selectedChecks[i].value];
        const currentName = item.Name ? item.Name.toString().trim() : '';
        
        if (i === 0) {
          firstCheckedName = currentName;
        } else {
          if (currentName !== firstCheckedName) {
            hasDifferentNames = true;
            break;
          }
        }
      }

      if (hasDifferentNames) {
        alert('請選擇相同姓名的訂單來產生報表 (Please select orders with the same Name)');
        return;
      }

      const reportTbody = document.getElementById('reportTbody');
      reportTbody.innerHTML = '';
      
      let grandTotal = 0; let grandSaved = 0;
      let urlsToFetch = new Set(); 

      const firstIdx = selectedChecks[0].value;
      const reportDateRaw = allOrdersData[firstIdx].Date ? allOrdersData[firstIdx].Date.toString().split('T')[0] : '';
      
      document.getElementById('reportDate').innerText = reportDateRaw;
      document.getElementById('reportName').innerText = `${allOrdersData[firstIdx].Name}`;

      selectedChecks.forEach(check => {
        const item = allOrdersData[check.value];
        const itemTotal = parseFloat(item.Total) || 0;
        grandTotal += itemTotal;
        grandSaved += parseFloat(item.Saved) || 0;
        
        const imageUrl = findImageUrl(item);
        if (imageUrl) urlsToFetch.add(imageUrl);

        const formattedDiscount = formatDiscountForDisplay(item.Discount);
        let discountHtml = '';
        if (formattedDiscount !== '-') {
            discountHtml = `<span style="color: #333;">${formattedDiscount}</span>`;
        }

        const tr = document.createElement('tr');
        
        const priceStr = formatNumber(item.Price);
        const itemTotalStr = formatNumber(itemTotal);

        // 原生四欄結構，每個數值皆被鎖在專屬寬度的格子內，達成完美置中與數值靠右
        tr.innerHTML = `
          <td style="padding: 12px 4px; color: #333; font-weight: 600;">${item.Item}</td>
          
          <!-- Price 區塊：置中，維持狹窄寬度 -->
          <td style="padding: 12px 4px; text-align: center; color: #7f8c8d;">$${priceStr}</td>
          
          <!-- 折數：右側 padding 歸零，讓它徹底靠向金額 -->
          <td style="padding: 12px 0px 12px 4px; text-align: right; width: 45px;">${discountHtml}</td>
          
          <!-- 金額：緊貼折數 -->
          <td style="padding: 12px 4px 12px 0; text-align: right; font-weight: 600; color: #2c3e50; width: 80px;">$${itemTotalStr}</td>
        `;
        reportTbody.appendChild(tr);
      });

      document.getElementById('reportSaved').innerText = `$${formatNumber(grandSaved)}`;
      document.getElementById('reportTotal').innerText = `$${formatNumber(grandTotal)}`;

      const reportImages = document.getElementById('reportImages');
      reportImages.innerHTML = '';
      
      if (urlsToFetch.size > 0) {
          showLoading(true, 'Fetching images...');
          const urlsArray = Array.from(urlsToFetch);
          
          fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getImagesBase64', urls: urlsArray })
          }).then(res => res.json()).then(res => {
            if (res.success) {
                for (const url of urlsArray) {
                    if (res.images[url]) {
                        const img = document.createElement('img');
                        img.src = res.images[url];
                        
                        img.style.width = '100%';
                        img.style.height = 'auto';
                        img.style.maxWidth = '550px'; 
                        
                        reportImages.appendChild(img);
                    }
                }
                setTimeout(executeCanvas, 500);
            } else {
                alert('Images load failed: ' + res.error);
                executeCanvas();
            }
          }).catch(err => {
              alert('Image fetch error');
              executeCanvas();
          });
      } else {
          executeCanvas();
      }
    }

    function executeCanvas() {
        showLoading(true, 'Generating report...');
        const renderArea = document.getElementById('renderArea');
        html2canvas(renderArea, { scale: 2 }).then(canvas => {
          showLoading(false);
          generatedCanvasDataUrl = canvas.toDataURL('image/jpeg', 0.9);
          document.getElementById('canvasResultImg').src = generatedCanvasDataUrl;
          document.getElementById('previewModal').style.display = 'flex';
        }).catch(err => { 
          showLoading(false); 
          alert('Generate failed'); 
        });
    }

    function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

    function shareOrDownloadImage() {
      if (!generatedCanvasDataUrl) return;
      fetch(generatedCanvasDataUrl).then(res => res.blob()).then(blob => {
        const file = new File([blob], "Order_Summary.jpg", { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Order Summary' });
        } else {
          const a = document.createElement('a'); a.href = generatedCanvasDataUrl; a.download = 'Order_Summary.jpg'; a.click();
        }
      });
    }

    const resultImg = document.getElementById('canvasResultImg');
    resultImg.addEventListener('dblclick', function() { this.classList.toggle('fullscreen'); });
    resultImg.addEventListener('click', function() { if (this.classList.contains('fullscreen')) this.classList.remove('fullscreen'); });
  </script>
</body>
</html>
